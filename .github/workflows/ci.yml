name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: jvm suites, lint, and the abi check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/contract-fixtures

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # `build` covers the unit suites, Android lint, the ABI check against the
      # committed dump, and the consumer fixture's minified release build.
      - run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**

  # Every commit on main is resolvable as <next version>-SNAPSHOT, so the
  # flagship can consume the SDK between releases instead of waiting for a tag.
  # Gated on `build` only: the instrumented smoke is a separate job, so a
  # snapshot can publish while a device failure is still being chased.
  snapshot:
    name: publish the snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # No -PRELEASE: the build appends -SNAPSHOT, and the plugin routes a
      # snapshot to Central's snapshot repository rather than a deployment.
      - name: Publish the snapshot
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace

  instrumented:
    name: instrumented smoke (managed device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # The managed device needs hardware acceleration on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # AGP installs the managed device's system image itself, but refuses to
      # until the licences are on disk, and the runner ships the SDK without the
      # system-image one accepted. No `pipefail` here on purpose: `yes` dies of
      # SIGPIPE when sdkmanager stops reading, which would fail the step.
      - name: Accept the Android SDK licences
        run: |
          set -eu
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          if [ -z "$sdkmanager" ]; then
            echo "no sdkmanager under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses > /dev/null

      - run: ./gradlew :lever:smokeApi30DebugAndroidTest --stacktrace

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: instrumented-reports
          path: lever/build/reports/**
